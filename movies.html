<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAN LAND - Movies</title>
    <style>
        :root {
            --bg-obsidian: #080808;
            --card-bg: #111111;
            --card-hover: #181818;
            --crimson: #8b0000;
            --crimson-glow: #ff1a1a;
            --text-light: #f2f2f2;
            --text-muted: #888888;
            --border-color: rgba(139, 0, 0, 0.25);
        }

        body {
            background-color: var(--bg-obsidian);
            color: var(--text-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            cursor: none;
        }

        header {
            padding: 20px 40px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(8, 8, 8, 0.9);
        }

        .logo {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--crimson-glow);
            letter-spacing: 2px;
            text-decoration: none;
        }

        main {
            flex: 1;
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        h2 {
            color: var(--crimson-glow);
            margin-bottom: 20px;
        }

        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .movie-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            cursor: none;
            transition: all 0.2s ease;
        }

        .movie-card:hover {
            border-color: var(--crimson-glow);
            background-color: var(--card-hover);
            transform: translateY(-3px);
        }

        .movie-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--text-light);
        }

        .movie-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .edit-form {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .edit-form input {
            background: #050505;
            border: 1px solid var(--border-color);
            color: white;
            padding: 6px;
            border-radius: 4px;
            font-size: 0.85rem;
        }

        .btn {
            background: var(--crimson);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: none;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .btn:hover {
            background: var(--crimson-glow);
        }

        /* Netflix-Style Video Overlay Player */
        .player-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9998;
        }

        .player-overlay.active {
            display: flex;
        }

        .video-container {
            position: relative;
            width: 85%;
            max-width: 1000px;
            background: black;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(139, 0, 0, 0.5);
        }

        video {
            width: 100%;
            display: block;
        }

        .net-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(transparent, rgba(0,0,0,0.85));
            padding: 15px 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            box-sizing: border-box;
        }

        .net-controls button, .net-controls input[type="range"] {
            cursor: none;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            background: var(--crimson);
            color: white;
            border: none;
            font-size: 1.2rem;
            padding: 8px 14px;
            border-radius: 50%;
            cursor: none;
            z-index: 10000;
        }

        /* Custom Cursor */
        .cursor {
            position: fixed;
            width: 12px;
            height: 12px;
            background-color: var(--crimson-glow);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px var(--crimson-glow);
            transition: transform 0.1s ease, width 0.2s, height 0.2s, background-color 0.2s;
            z-index: 99999;
        }
        .cursor.hovered {
            width: 22px;
            height: 22px;
            background-color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="cursor" id="cursor"></div>

    <header>
        <a href="home.html" class="logo">LAN LAND</a>
    </header>

    <main>
        <h2>MOVIES VAULT</h2>
        <div class="movie-grid" id="movie-grid">
            <!-- Dynamically populated -->
        </div>
    </main>

    <!-- Netflix Style Video Player Overlay -->
    <div class="player-overlay" id="playerOverlay">
        <button class="close-btn" id="closePlayer">X</button>
        <div class="video-container">
            <video id="videoPlayer"></video>
            <div class="net-controls">
                <button class="btn" id="playPauseBtn">Pause</button>
                <button class="btn" id="fastForwardBtn">+10s</button>
                <input type="range" id="seekBar" value="0" max="100" style="flex:1;">
                <button class="btn" id="audioBtn">Mute</button>
                <button class="btn" id="maxBtn">Maximize</button>
            </div>
        </div>
    </div>

    <script>
        // Custom Cursor Logic
        const cursor = document.getElementById('cursor');
        window.addEventListener('mousemove', (e) => {
            cursor.style.left = `${e.clientX}px`;
            cursor.style.top = `${e.clientY}px`;
        });
        document.addEventListener('mouseover', (e) => {
            if (['A', 'BUTTON', 'INPUT'].includes(e.target.tagName)) {
                cursor.classList.add('hovered');
            } else {
                cursor.classList.remove('hovered');
            }
        });

        // Load movies from backend and local storage metadata cache
        async function loadMovies() {
            try {
                const response = await fetch('/api/movies');
                const movies = await response.json();
                const grid = document.getElementById('movie-grid');
                grid.innerHTML = '';

                movies.forEach(m => {
                    const savedMeta = JSON.parse(localStorage.getItem('meta_' + m.filename)) || {};
                    const isCustomized = savedMeta.name ? true : false;

                    const card = document.createElement('div');
                    card.className = 'movie-card';

                    if (isCustomized) {
                        card.innerHTML = `
                            <div class="movie-title">${savedMeta.name}</div>
                            <div class="movie-meta">Release: ${savedMeta.date}</div>
                            <div class="movie-meta">Resolution: ${savedMeta.res}</div>
                            <div class="movie-meta">Source: ${savedMeta.source}</div>
                        `;
                        card.addEventListener('click', () => openPlayer(m.filename));
                    } else {
                        card.innerHTML = `
                            <div class="movie-title">${m.filename}</div>
                            <div class="movie-meta" style="color:var(--crimson-glow);">Raw File (No official entry)</div>
                            <div class="edit-form" onclick="event.stopPropagation()">
                                <input type="text" placeholder="Movie Name" id="name_${m.filename}">
                                <input type="text" placeholder="Release Date" id="date_${m.filename}">
                                <input type="text" placeholder="Resolution (e.g. 1080p)" id="res_${m.filename}">
                                <input type="text" placeholder="Company/Source (e.g. Bluray)" id="src_${m.filename}">
                                <button class="btn" onclick="saveEntry('${m.filename}')">Create Entry</button>
                            </div>
                        `;
                        card.addEventListener('click', () => openPlayer(m.filename));
                    }
                    grid.appendChild(card);
                });
            } catch (err) {
                console.error("Could not load movies API", err);
            }
        }

        function saveEntry(filename) {
            const name = document.getElementById('name_' + filename).value;
            const date = document.getElementById('date_' + filename).value;
            const res = document.getElementById('res_' + filename).value;
            const source = document.getElementById('src_' + filename).value;

            if (name) {
                localStorage.setItem('meta_' + filename, JSON.stringify({name, date, res, source}));
                loadMovies();
            }
        }

        // Player Controls Logic
        const overlay = document.getElementById('playerOverlay');
        const video = document.getElementById('videoPlayer');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const closePlayer = document.getElementById('closePlayer');
        const seekBar = document.getElementById('seekBar');
        const audioBtn = document.getElementById('audioBtn');
        const maxBtn = document.getElementById('maxBtn');

        function openPlayer(filename) {
            video.src = `/stream/${filename}`;
            overlay.classList.add('active');
            video.play();
        }

        closePlayer.addEventListener('click', () => {
            video.pause();
            video.src = '';
            overlay.classList.remove('active');
        });

        playPauseBtn.addEventListener('click', () => {
            if (video.paused) {
                video.play();
                playPauseBtn.innerText = "Pause";
            } else {
                video.pause();
                playPauseBtn.innerText = "Play";
            }
        });

        document.getElementById('fastForwardBtn').addEventListener('click', () => {
            video.currentTime += 10;
        });

        video.addEventListener('timeupdate', () => {
            if (video.duration) {
                seekBar.value = (video.currentTime / video.duration) * 100;
            }
        });

        seekBar.addEventListener('input', () => {
            if (video.duration) {
                video.currentTime = (seekBar.value / 100) * video.duration;
            }
        });

        audioBtn.addEventListener('click', () => {
            video.muted = !video.muted;
            audioBtn.innerText = video.muted ? "Unmute" : "Mute";
        });

        maxBtn.addEventListener('click', () => {
            if (video.requestFullscreen) {
                video.requestFullscreen();
            }
        });

        loadMovies();
    </script>
</body>
</html>
